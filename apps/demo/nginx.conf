# Static files only. The lab replaces this file with proxy-shopping-go/lab/demo/nginx.conf.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  location = /demo-config.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  location ~ \.map$ {
    return 404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
