server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Security headers (HSTS is added by the TLS terminator in front, e.g. Caddy in the lab).
  # nginx does not inherit add_header into locations that set their own, so they live in one include-like block per location.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";

  # Runtime configuration is mounted, never cache it.
  location = /config.json {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Frame-Options DENY always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Frame-Options DENY always;
    try_files $uri =404;
  }

  # Source maps are not built for production; never serve stray ones.
  location ~ \.map$ {
    return 404;
  }

  # SPA fallback
  location / {
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Frame-Options DENY always;
    try_files $uri $uri/ /index.html;
  }
}
