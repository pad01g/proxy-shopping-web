name: Publish MCP server

# The MCP server (packages/mcp):
#   ghcr.io/pad01g/proxy-shopping-mcp:<version>   OCI image, stdio transport
#   io.github.pad01g/proxy-shopping                entry in the MCP registry (registry.modelcontextprotocol.io)
# A tag mcp-v<version> (the version of packages/mcp/package.json and server.json) publishes both.

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:
    inputs:
      publish_registry:
        description: "also publish packages/mcp/server.json to the MCP registry"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'pad01g/proxy-shopping-web'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: pad01g/proxy-shopping-go
          path: proxy-shopping-go
      # the MCP tests run the registry's own validator on the entries registry_entry writes
      - uses: actions/checkout@v5
        with:
          repository: pad01g/proxy-shopping-registry
          path: proxy-shopping-registry
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: server.json, package.json and the tag agree on the version
        id: version
        working-directory: packages/mcp
        run: |
          v=$(jq -r .version package.json)
          test "$(jq -r .version server.json)" = "$v"
          jq -e --arg v "$v" '.packages[0].identifier == "ghcr.io/pad01g/proxy-shopping-mcp:" + $v' server.json
          jq -e '.name == "io.github.pad01g/proxy-shopping"' server.json
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then test "${GITHUB_REF_NAME}" = "mcp-v$v"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (core with the Go repo's cross-implementation vectors, and the MCP tools)
        run: ln -s "$PWD/proxy-shopping-go" ../proxy-shopping-go && ln -s "$PWD/proxy-shopping-registry" ../proxy-shopping-registry && npm ci --prefix proxy-shopping-registry && npm test
      - run: npm run build -w @proxy-shopping/mcp

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DESCRIPTION: "MCP server for proxy-shopping: buy from cash-only or unsupported shops with crypto through a proxy shopper, with a 2-of-3 escrow; or earn as a proxy shopper"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pad01g/proxy-shopping-mcp
          tags: |
            type=raw,value=${{ needs.test.outputs.version }}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/pad01g/proxy-shopping-web
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=MIT
            io.modelcontextprotocol.server.name=io.github.pad01g/proxy-shopping
          annotations: |
            org.opencontainers.image.source=https://github.com/pad01g/proxy-shopping-web
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=MIT
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false

  mcp-registry:
    needs: image
    if: startsWith(github.ref, 'refs/tags/mcp-v') || inputs.publish_registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with the GitHub OIDC token (namespace io.github.pad01g)
        run: ./mcp-publisher login github-oidc
      - name: Publish packages/mcp/server.json
        working-directory: packages/mcp
        run: ../../mcp-publisher publish

  github-release:
    needs: [test, mcp-registry]
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: MCPB bundle (one-click install for Claude Desktop and other MCPB clients; Smithery)
        run: npm ci && npm run build -w @proxy-shopping/core && node packages/mcp/scripts/build-mcpb.mjs
      - name: GitHub Release for the tag (image and registry entry are published)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.test.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber "packages/mcp/dist-mcpb/proxy-shopping-$V.mcpb"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "MCP server $V" \
            --notes "MCP server \`io.github.pad01g/proxy-shopping\` $V (packages/mcp).

          \`\`\`sh
          claude mcp add proxy-shopping -- docker run -i --rm -v proxy-shopping-mcp:/data ghcr.io/pad01g/proxy-shopping-mcp:$V
          \`\`\`

          Image: \`ghcr.io/pad01g/proxy-shopping-mcp:$V\` (linux/amd64, linux/arm64). MCPB bundle: \`proxy-shopping-$V.mcpb\` below. Changes: https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME/packages/mcp"
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber "packages/mcp/dist-mcpb/proxy-shopping-$V.mcpb"
